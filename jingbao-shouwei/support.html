  <h1>晶堡守卫支持</h1>
  <p>感谢游玩《晶堡守卫》。</p>
  <h2>常见问题</h2>
  <p><strong>如何继续未完成的战局？</strong><br>返回主城后，点击“继续游戏”即可恢复本地保存的战局。</p>
  <p><strong>如何关闭音乐或音效？</strong><br>在主城设置或战斗暂停菜单中分别关闭音乐和音效。</p>
  <p><strong>进度是否会同步到其他设备？</strong><br>不会。当前版本只在本机保存，不提供账号或云同步。</p>
  <p><strong>如何重置游戏？</strong><br>删除应用会同时删除设备上的本地进度。请谨慎操作。</p>
  <h2>反馈问题</h2>
  <p>联系开发者时，请说明设备型号、iOS 版本、游戏版本、问题发生的关卡和可复现步骤。</p>
  <p>联系邮箱：<a href="mailto:494763134@qq.com">494763134@qq.com</a></p>
